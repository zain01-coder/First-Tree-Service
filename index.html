<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e3a2b" />

    <!-- Local-intent title and description. Replace the bracketed placeholders. -->
    <title>[Business Name] | Tree Removal &amp; Trimming in [City, State]</title>
    <meta
      name="description"
      content="Tree removal, trimming and stump grinding in [City, State]. Storm damage response, safe large-tree removal over roofs and fences, full cleanup. Free estimates — call [PHONE NUMBER]."
    />
    <link rel="canonical" href="[SITE URL]" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="[Business Name] | Tree Removal &amp; Trimming in [City, State]" />
    <meta
      property="og:description"
      content="Tree removal, trimming and stump grinding in [City, State]. Free estimates, full cleanup, storm damage response."
    />
    <meta property="og:url" content="[SITE URL]" />

    <!--
      LocalBusiness structured data for local SEO.
      Every bracketed value below must be replaced with real data before launch;
      leaving placeholders in JSON-LD is worse than omitting the block entirely.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "additionalType": "https://schema.org/HomeAndConstructionBusiness",
        "name": "[Business Name]",
        "description": "Tree removal, trimming and pruning, stump grinding and storm damage response in [City, State].",
        "telephone": "[PHONE NUMBER]",
        "email": "[EMAIL]",
        "url": "[SITE URL]",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "[STREET ADDRESS]",
          "addressLocality": "[City]",
          "addressRegion": "[State]",
          "postalCode": "[ZIP]",
          "addressCountry": "US"
        },
        "areaServed": ["[City]", "[NEARBY CITY 1]", "[NEARBY CITY 2]"],
        "openingHours": "[OPENING HOURS — e.g. Mo-Fr 07:00-17:00]",
        "priceRange": "[PRICING — confirm typical range]"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
